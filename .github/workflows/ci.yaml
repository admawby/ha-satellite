name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  addon-lint:
    name: Add-on linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: frenck/action-addon-linter@v2
        with:
          path: "./ha_satellite"

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -x ha_satellite/rootfs/opt/hasat/agent/install.sh ha_satellite/rootfs/opt/hasat/agent/container/run.sh .github/scripts/docker-mirror.sh

  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install aiohttp cryptography asyncssh paho-mqtt psutil
      - run: python -m compileall -q ha_satellite/rootfs/opt/hasat
      - run: python tests/test_e2e.py

  docker:
    name: Docker integration (real daemon)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use a Docker Hub mirror (avoids anonymous pull rate limits)
        run: .github/scripts/docker-mirror.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install aiohttp psutil cryptography
      - run: python tests/test_docker_real.py
      - name: Pretend to be Synology DSM (for the container-mode test)
        run: |
          sudo mkdir -p /etc.defaults
          printf 'productversion="7.2.1"\nbuildnumber="69057"\nsmallfixnumber="5"\n' | sudo tee /etc.defaults/VERSION
      - run: python tests/test_container_agent.py

  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, amd64]
    steps:
      - uses: actions/checkout@v4
      - name: Use a Docker Hub mirror (avoids anonymous pull rate limits)
        run: .github/scripts/docker-mirror.sh
      - name: ARM emulation from Ubuntu packages (no registry pull needed)
        if: matrix.arch == 'aarch64'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-user-static binfmt-support
          ls /proc/sys/fs/binfmt_misc/ | grep -i aarch64
      - name: Test build
        uses: home-assistant/builder@2025.03.0
        with:
          args: |
            --test \
            --${{ matrix.arch }} \
            --target /data/ha_satellite \
            --image "{arch}-ha-satellite" \
            --docker-hub "ghcr.io/${{ github.repository_owner }}"
