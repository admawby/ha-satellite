name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  addon-lint:
    name: Add-on linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: frenck/action-addon-linter@v2
        with:
          path: "./ha_satellite"

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -x ha_satellite/rootfs/opt/hasat/agent/install.sh

  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install aiohttp cryptography asyncssh paho-mqtt psutil
      - run: python -m compileall -q ha_satellite/rootfs/opt/hasat
      - run: python tests/test_e2e.py

  docker:
    name: Docker integration (real daemon)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install aiohttp psutil
      - run: python tests/test_docker_real.py

  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [aarch64, amd64]
    steps:
      - uses: actions/checkout@v4
      - name: Test build
        uses: home-assistant/builder@2025.03.0
        with:
          args: |
            --test \
            --${{ matrix.arch }} \
            --target /data/ha_satellite \
            --image "{arch}-ha-satellite" \
            --docker-hub "ghcr.io/${{ github.repository_owner }}"
